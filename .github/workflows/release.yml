# Publishes a GitHub Release when you push a v* tag (e.g. `git tag v0.1.0 && git push --tags`).
#
# NOTE ON THE BUILD: compiling a Valheim mod needs the game's managed assemblies
# (assembly_valheim.dll, UnityEngine*.dll), which are NOT redistributable and are
# not present on CI runners. So this workflow does NOT compile. Instead, build +
# package locally with `scripts/package.sh`, commit the resulting
# dist/ValheimMCP-<version>.zip on the tagged commit, and this workflow attaches it.
# Upload the same zip to Thunderstore (https://thunderstore.io/c/valheim/) manually
# or via the Thunderstore CLI (`tcli`).
#
# RUNNER: `runs-on` must be a hosted-runner label (you cannot set `runs-on: alpine`);
# the steps run inside the lightweight Alpine `container` below. We avoid the usual
# JavaScript actions (actions/checkout, action-gh-release) because their bundled
# Node is glibc-linked and won't run on Alpine's musl — so this is shell-only,
# using git + the gh CLI.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: alpine:3.21
    steps:
      - name: Install tools
        run: apk add --no-cache git github-cli

      - name: Checkout tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh reads the token from the environment: it is not written into the clone's remote URL
          gh repo clone "${GITHUB_REPOSITORY}" repo -- --depth 1 --branch "${GITHUB_REF_NAME}"

      - name: Tag matches the project version
        working-directory: repo
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' ValheimMCP.csproj | head -1)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match <Version> ${version} in ValheimMCP.csproj" >&2
            exit 1
          fi

      - name: Create GitHub Release
        working-directory: repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          zip="dist/ValheimMCP-${GITHUB_REF_NAME}.zip"
          if [ ! -f "$zip" ]; then
            echo "No $zip found on the tagged commit." >&2
            echo "Build it locally with scripts/package.sh and commit it under dist/." >&2
            exit 1
          fi
          extversion="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' ext/Version.props | head -1)"
          assets="$zip"
          [ -f "dist/HubnerExt-v${extversion}.zip" ] && assets="$assets dist/HubnerExt-v${extversion}.zip"
          # shellcheck disable=SC2086
          gh release create "${GITHUB_REF_NAME}" $assets \
            --title "${GITHUB_REF_NAME}" \
            --notes "See CHANGELOG.md for changes in this release." \
            --generate-notes
