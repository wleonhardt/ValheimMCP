# CI. The plugin itself cannot be compiled on a runner (it needs Iron Gate's and BepInEx's assemblies, which are not redistributable
# and are not in this repository). What runs here: unit tests of the game-free parts (JSON, YAML, request policy, journal format,
# plan keys, write gate, command policy, protocol negotiation), the Python client's offline tests, the project files parse, and no machine-specific
# paths, private addresses or secrets are committed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Unit tests (game-free sources)
        run: dotnet test tests/ValheimMCP.Tests --nologo

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python client compiles and its offline tests pass
        run: |
          python3 -m compileall -q python scripts
          python3 -m unittest discover -s python/tests

      - name: Lints (silent catch against its baseline, write APIs only in their files, tool catalogue current, documents point at things that exist)
        run: |
          python3 -m unittest discover -s scripts/tests
          python3 scripts/lint_catch.py
          python3 scripts/lint_writes.py
          python3 scripts/lint_tools.py
          python3 scripts/lint_docs.py

      - name: Project and config files parse
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils >/dev/null
          xmllint --noout ValheimMCP.csproj ext/*.csproj ext/Version.props tests/ValheimMCP.Tests/*.csproj
          python3 - <<'PY'
          import glob, json
          for f in glob.glob("Thunderstore/manifest.json"): json.load(open(f))
          PY

      - name: No absolute paths, private addresses or secrets in tracked files
        run: |
          set -u
          pat='(/Users/[A-Za-z0-9._-]+|/home/[A-Za-z0-9._-]+/|[A-Z]:[\\/]Users|10\.11\.[0-9]+\.[0-9]+|192\.168\.[0-9]+\.[0-9]+|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|CT241|Ducky)'
          if git grep -nIE "$pat" -- . ':!dist' ':!.github/workflows/ci.yml'; then
            echo "machine-specific path, private address or secret found above" >&2; exit 1
          fi

      - name: No game or loader binaries committed (outside dist/)
        run: |
          if git ls-files | grep -iE '\.(dll|exe|pdb)$' | grep -v '^dist/'; then
            echo "binaries must not be committed (use dist/ for release zips)" >&2; exit 1
          fi
          if git ls-files -s | grep -E '^120000'; then
            echo "symlinks must not be committed (ext/lib was one, pointing into a home directory)" >&2; exit 1
          fi
