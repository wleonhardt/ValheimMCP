# ValheimMCP config for the sandbox client on Ducky (loopback only; reach it through an SSH tunnel).
server:
  host: 127.0.0.1
  port: 8731
  commandTimeoutMs: 15000
render:
  defaultSize: 1024
  minSize: 256
  maxSize: 1280
commands:
  # deny always wins; a non-empty allow list restricts everything else. Widen after `list_commands`.
  allow:
    - pos
    - goto
    - fly
    - ghost
    - debugmode
    - devcommands
    - tp
    - terrain
    - object
    - spawn_object
    - data
    - tod
    - players
    - help
    - lodbias
  deny:
    - exec
    - quit
    - logout
    - kick*
    - ban*
    - save

# Hubner extension tools (hubner-mcp/ext): write enables spawn/modify/delete/undo; no terrain-edit tools exist.
tools:
  write: true
  timeoutMs: 30000
  deny: []
  # profile: all | observe | build | control (what tools/list advertises; every tool stays callable), terse: first sentence only
  profile: all
  terse: false

# Hubner extension settings (BepInEx/hubner-ext/HubnerExt.dll)
hubner:
  sandboxNames: [Odev, MaRkO, ClaudeEyes]   # character names that count as the sandbox (players tool, restart checks)
  writeFlagMinutes: 30                      # server only: validity of the ALLOW_SERVER_WRITES flag after it was touched
  jobBudgetMs: 8                            # main-thread time a sliced job (plan_apply) may use per frame
