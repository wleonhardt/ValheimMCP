# ValheimMCP config for the sandbox game client (loopback only; reach it through an SSH tunnel from another machine).
server:
  host: 127.0.0.1          # a non-loopback host is refused unless token is set
  port: 8731
  commandTimeoutMs: 15000
  # token: ''              # optional shared secret (Authorization: Bearer <token>); quote it if it contains ' #'
render:
  defaultSize: 1024
  minSize: 256
  maxSize: 1280
commands:
  # deny always wins; a non-empty allow list restricts everything else. Widen after `list_commands`.
  allow:
    - pos
    - goto
    - fly
    - ghost
    - debugmode
    - devcommands
    - tp
    - terrain
    - object
    - spawn_object
    - data
    - tod
    - players
    - help
    - lodbias
  deny:
    - exec
    - quit
    - logout
    - kick*
    - ban*
    - save

# write enables run_command (console commands) and the extension's spawn/modify/delete/undo/teleport/walk/...; the terrain tools (terrain_paint, terrain_level, terrain_wec) are write tools too, and terrain_wec also needs `terrain` in commands.allow.
tools:
  write: true
  timeoutMs: 30000
  deny: []
  # profile: all | observe | build | control (what tools/list advertises; every tool stays callable), terse: first sentence only
  profile: all
  terse: false

# Hubner extension settings (BepInEx/hubner-ext/HubnerExt.dll)
hubner:
  sandboxNames: [Odev, MaRkO, ClaudeEyes]   # character names that count as the sandbox: only they get god mode from teleport / walk_to / auto-join
  exposePeerHosts: false                    # true: the players tool returns each peer's IP / Steam id
  captureWhispers: false                    # true: chat_tail also records whispers
  trustedPlayers: []                        # platform ids (Steam_7656...) whose chat is not marked untrusted by chat_tail
  writeFlagMinutes: 30                      # server only: validity of the ALLOW_SERVER_WRITES flag after it was touched
  jobBudgetMs: 8                            # main-thread time a sliced job (plan_apply) may use per frame
